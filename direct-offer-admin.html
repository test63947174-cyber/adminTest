<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔴 TESTING FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDsuqsmiwIG3Ey57MR19tr_8wJQRQ3_W64",
  authDomain: "rwebsite-e031b.firebaseapp.com",
  databaseURL: "https://rwebsite-e031b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rwebsite-e031b",
  storageBucket: "rwebsite-e031b.firebasestorage.app",
  messagingSenderId: "376966041558",
  appId: "1:376966041558:web:02bc9062ec182590275e77",
  measurementId: "G-0T1FREXHD3"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const CAMPAIGN_ID = "bumper_referral_offer_2026";

let allUsers = {};
let purchases = {};
let withdrawals = {};
let listenersStarted = false;

const $ = id => document.getElementById(id);
const money = n => "$" + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const fmtDate = ms => ms ? new Date(Number(ms)).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }) : "—";

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loadingScreen").style.display = "none";
    $("mainContent").style.display = "block";
    startListeners();
  } else {
    $("loadingScreen").innerHTML = `<div class="text-danger text-center px-3">Access Denied. Please login through the main admin panel.</div>`;
  }
});

function startListeners() {
  if (listenersStarted) return;
  listenersStarted = true;
  $("liveStatus").textContent = "Connecting...";

  onValue(ref(db, "users"), snapshot => {
    allUsers = snapshot.val() || {};
    renderAll();
  }, error => showError("Could not read users: " + error.message));

  onValue(ref(db, `${CAMPAIGN_ID}/purchases`), snapshot => {
    purchases = snapshot.val() || {};
    renderAll();
  }, error => showError("Could not read purchases: " + error.message));

  onValue(ref(db, `${CAMPAIGN_ID}/withdrawals`), snapshot => {
    withdrawals = snapshot.val() || {};
    renderAll();
  }, error => showError("Could not read withdrawals: " + error.message));
}

function showError(message) {
  const el = $("pageError");
  el.style.display = "block";
  el.textContent = message;
}

function getUser(uid) { return allUsers[uid] || {}; }

function displayName(uid, fallback = "") {
  const user = getUser(uid);
  return user.name || user.fullName || user.username || fallback || "Unknown user";
}

function purchaseRows() {
  return Object.entries(purchases)
    .map(([id, p]) => ({ id, ...(p || {}) }))
    .filter(p => p.directReferrerUid && p.status !== "rejected");
}

function earningsByReferrer() {
  const groups = {};
  for (const p of purchaseRows()) {
    const uid = String(p.directReferrerUid);
    const reward = Number(p.rewardAmount) || 0;
    if (!groups[uid]) groups[uid] = { uid, total: 0, packages: 0, tierBreakdown: {} };
    groups[uid].total += reward;
    groups[uid].packages++;
    const tk = String(p.tierKey || "—");
    groups[uid].tierBreakdown[tk] = (groups[uid].tierBreakdown[tk] || 0) + 1;
  }
  return Object.values(groups).sort((a, b) => b.total - a.total);
}

function renderAll() {
  const rows = purchaseRows();
  const groups = earningsByReferrer();
  const totalReward = rows.reduce((sum, p) => sum + (Number(p.rewardAmount) || 0), 0);

  $("earningUsers").textContent = groups.length.toLocaleString();
  $("rewardsGenerated").textContent = money(totalReward);

  renderEarnings(groups);
  renderWithdrawals();
  $("liveStatus").textContent = "● Live connected";
}

function renderEarnings(groups) {
  const query = $("earningsSearch").value.trim().toLowerCase();
  const filtered = groups.filter(g => {
    const user = getUser(g.uid);
    const hay = [g.uid, user.name, user.fullName, user.username, user.email].join(" ").toLowerCase();
    return (!query || hay.includes(query));
  });

  $("earningsBody").innerHTML = filtered.length ? filtered.map(g => {
    const user = getUser(g.uid);
    const tiers = Object.entries(g.tierBreakdown).map(([k, v]) => `<span class="badge badge-soft me-1">$${k}: ${v}</span>`).join("");
    return `
      <tr>
        <td><strong>${esc(displayName(g.uid))}</strong><div class="muted">${esc(user.email || "")}</div></td>
        <td>${esc(user.username || "—")}</td>
        <td class="mono">${esc(g.uid)}</td>
        <td><span class="badge bg-secondary">${g.packages}</span> <div class="mt-1">${tiers}</div></td>
        <td class="text-success fw-bold fs-6">${money(g.total)}</td>
      </tr>
    `;
  }).join("") : `<tr><td colspan="5" class="text-center muted py-4">No matching users found.</td></tr>`;
}

function renderWithdrawals() {
  const entries = Object.entries(withdrawals)
    .map(([id, w]) => ({ id, ...(w || {}) }))
    .sort((a, b) => (Number(b.requestedAt) || 0) - (Number(a.requestedAt) || 0));

  let pending = 0, paid = 0;
  entries.forEach(w => {
    const amount = Number(w.amount) || 0;
    const status = String(w.status || "pending").toLowerCase();
    if (status === "pending") pending++;
    else if (status === "paid") paid += amount;
  });

  $("pendingCount").textContent = pending;
  $("paidTotal").textContent = money(paid);

  const query = $("withdrawalSearch").value.trim().toLowerCase();
  const filter = $("withdrawalStatusFilter").value;
  const filtered = entries.filter(w => {
    const user = getUser(w.userId || "");
    const hay = [w.userId, w.username, w.withdrawalId, w.walletAddress, user.name, user.username].join(" ").toLowerCase();
    return (!query || hay.includes(query)) && (filter === "all" || String(w.status || "pending").toLowerCase() === filter);
  });

  $("withdrawalsBody").innerHTML = filtered.length ? filtered.map(w => {
    const uid = w.userId || "";
    const user = getUser(uid);
    const status = String(w.status || "pending").toLowerCase();
    const wallet = String(w.walletAddress || "");
    let actions = "";
    if (status === "pending") {
      actions = `
        <button class="btn btn-success btn-sm me-1" onclick="approveWithdrawal('${w.id}')">Approve</button>
        <button class="btn btn-danger btn-sm" onclick="rejectWithdrawal('${w.id}')">Reject</button>`;
    } else if (status === "approved") {
      actions = `<button class="btn btn-primary btn-sm" onclick="markAsPaid('${w.id}')">Mark as Paid</button>`;
    } else {
      actions = `<span class="muted">Done</span>`;
    }
    return `
      <tr>
        <td><strong>${esc(displayName(uid, w.username))}</strong><div class="muted">${esc(w.email || user.email || "")}</div></td>
        <td class="mono">${esc(uid)}</td>
        <td class="text-warning fw-bold">${money(w.amount)} USDT</td>
        <td>${fmtDate(w.requestedAt)}</td>
        <td>
          <div class="wallet mono">${esc(wallet || "No wallet address")}</div>
          <div class="mt-1 d-flex gap-1 flex-wrap">
            <button class="btn btn-outline-info btn-sm" onclick="copyAddress('${esc(wallet)}')"><i class="bi bi-clipboard me-1"></i>Copy</button>
            <a class="btn btn-outline-light btn-sm" target="_blank" href="https://bscscan.com/address/${esc(wallet)}"><i class="bi bi-box-arrow-up-right me-1"></i>BscScan</a>
          </div>
        </td>
        <td><span class="status status-${status}">${status}</span></td>
        <td>${actions}</td>
      </tr>`;
  }).join("") : `<tr><td colspan="7" class="text-center muted py-4">No withdrawal requests match this filter.</td></tr>`;
}

// ✅ सिंपल और सटीक अपडेट फंक्शन
async function updateWithdrawalStatus(withdrawalId, newStatus) {
  const w = withdrawals[withdrawalId];
  if (!w) return alert("Withdrawal not found!");
  const uid = w.userId;
  const now = Date.now();
  const updates = {};

  // 1. मुख्य विड्रॉल नोड
  updates[`${CAMPAIGN_ID}/withdrawals/${withdrawalId}/status`] = newStatus;
  updates[`${CAMPAIGN_ID}/withdrawals/${withdrawalId}/updatedAt`] = now;
  
  // 2. यूज़र का विड्रॉल स्टेटस (सिर्फ यही अपडेट करने की ज़रूरत है ताकि यूज़र को दिखे)
  updates[`${CAMPAIGN_ID}/user_withdrawals/${uid}/${withdrawalId}/status`] = newStatus;
  updates[`${CAMPAIGN_ID}/user_withdrawals/${uid}/${withdrawalId}/updatedAt`] = now;

  // 3. अगर Paid हो रहा है तो txHash डालें
  let txHash = null;
  if (newStatus === "paid") {
    txHash = prompt("Please enter the USDT Transaction Hash (TxHash):");
    if (!txHash) return alert("Cancelled. TxHash is required.");
    
    updates[`${CAMPAIGN_ID}/withdrawals/${withdrawalId}/paidAt`] = now;
    updates[`${CAMPAIGN_ID}/withdrawals/${withdrawalId}/txHash`] = txHash;
    updates[`${CAMPAIGN_ID}/user_withdrawals/${uid}/${withdrawalId}/paidAt`] = now;
    updates[`${CAMPAIGN_ID}/user_withdrawals/${uid}/${withdrawalId}/txHash`] = txHash;
  }

  try {
    await update(ref(db), updates);
    alert(`✅ Status updated to ${newStatus.toUpperCase()} successfully!`);
  } catch (e) {
    console.error(e);
    alert("❌ Error updating status: " + e.message);
  }
}

window.copyAddress = function(wallet) {
  if (!wallet || wallet === "undefined") return alert("No address to copy");
  navigator.clipboard.writeText(wallet);
  alert("✅ Full wallet address copied!");
};

window.approveWithdrawal = async function(id) {
  if (!confirm("Are you sure you want to APPROVE this withdrawal?")) return;
  await updateWithdrawalStatus(id, "approved");
};

window.rejectWithdrawal = async function(id) {
  if (!confirm("Are you sure you want to REJECT this withdrawal?")) return;
  await updateWithdrawalStatus(id, "rejected");
};

window.markAsPaid = async function(id) {
  if (!confirm("Have you sent the USDT? Mark as PAID?")) return;
  await updateWithdrawalStatus(id, "paid");
};

$("earningsSearch")?.addEventListener("input", () => renderEarnings(earningsByReferrer()));
$("withdrawalSearch")?.addEventListener("input", renderWithdrawals);
$("withdrawalStatusFilter")?.addEventListener("change", renderWithdrawals);
$("refreshBtn")?.addEventListener("click", () => {
  renderAll();
  $("liveStatus").textContent = "● Refreshed";
  setTimeout(() => { $("liveStatus").textContent = "● Live connected"; }, 1500);
});
</script>
