<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Diwali Direct Offer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #080e1a; color: #f0f4ff; min-height: 100vh; }
        
        .navbar-custom {
            background: rgba(8,14,26,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(46,204,113,0.15);
            padding: 15px 0;
            position: sticky; top: 0; z-index: 1050;
        }
        .navbar-custom .navbar-brand { font-weight: 800; color: #fff !important; }
        .navbar-custom .navbar-brand i { color: #2ecc71; }
        
        .dashboard-container { padding: 30px 20px; max-width: 1300px; margin: 0 auto; }
        
        .card-glass {
            background: rgba(19,34,55,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46,204,113,0.1);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(19,34,55,0.6);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }
        .stat-card .stat-number { font-size: 2rem; font-weight: 800; color: #fff; }
        .stat-card .stat-label { color: #8899bb; font-size: 0.85rem; font-weight: 500; margin-top: 5px; }
        
        .table-custom { color: #f0f4ff; border-color: #1f334f; }
        .table-custom th { border-bottom: 2px solid #2a3a5a; color: #a0b8d0; font-weight: 600; }
        .table-custom td { border-color: #1f334f; vertical-align: middle; }
        
        .badge-pending { background: rgba(251,191,36,0.15); color: #fbbf24; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;}
        .badge-approved { background: rgba(46,204,113,0.15); color: #2ecc71; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;}
        
        .btn-copy {
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.2);
            color: #2ecc71;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:hover { background: rgba(46,204,113,0.2); transform: scale(1.05); }
        
        .wallet-address {
            font-family: monospace;
            font-size: 0.85rem;
            color: #60a5fa;
            background: rgba(96,165,250,0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-custom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin.html">
                <i class="bi bi-arrow-left me-2"></i> Back to Main Admin
            </a>
            <span class="text-success fw-bold"><i class="bi bi-gift me-1"></i> Diwali Direct Offer</span>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <!-- STATS ROW -->
        <div class="row g-4 mb-4">
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total Participating Users</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-number text-success" id="totalRewardsDist">$0</div>
                    <div class="stat-label">Total Rewards Distributed</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-number text-warning" id="pendingWithdrawals">0</div>
                    <div class="stat-label">Pending Withdrawals</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-number text-info" id="totalWithdrawn">$0</div>
                    <div class="stat-label">Total Paid Withdrawals</div>
                </div>
            </div>
        </div>

        <!-- WITHDRAWAL TABLE -->
        <div class="card-glass">
            <h4 class="mb-4"><i class="bi bi-wallet2 text-success me-2"></i>Withdrawal Requests</h4>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Reward Amount</th>
                            <th>Requested On</th>
                            <th>Wallet Address</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawalTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 🔥 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDsuqsmiwIG3Ey57MR19tr_8wJQRQ3_W64",
            authDomain: "rwebsite-e031b.firebaseapp.com",
            databaseURL: "https://rwebsite-e031b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rwebsite-e031b",
            storageBucket: "rwebsite-e031b.firebasestorage.app",
            messagingSenderId: "376966041558",
            appId: "1:376966041558:web:02bc9062ec182590275e77"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const CAMPAIGN_ID = "diwali_2026";

        // Copy to clipboard function
        window.copyAddress = function(address) {
            if (!address) return;
            navigator.clipboard.writeText(address).then(() => {
                alert('✅ Wallet Address Copied!');
            });
        };

        // Load Data from Firebase
        function loadDiwaliData() {
            // 1. Listen to Withdrawals
            const withdrawRef = ref(db, `direct_diwali_offer/${CAMPAIGN_ID}/withdrawals`);
            onValue(withdrawRef, (snapshot) => {
                const tbody = document.getElementById('withdrawalTableBody');
                tbody.innerHTML = '';
                let pendingCount = 0;
                let paidTotal = 0;

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const entries = Object.values(data).sort((a, b) => b.requestedAt - a.requestedAt);

                    entries.forEach(item => {
                        if (item.status === 'pending') pendingCount++;
                        if (item.status === 'paid' || item.status === 'approved') paidTotal += (item.amount || 0);

                        const date = new Date(item.requestedAt).toLocaleString();
                        const statusBadge = item.status === 'pending' 
                            ? '<span class="badge-pending">Pending</span>' 
                            : '<span class="badge-approved">Paid/Approved</span>';

                        // Action button (Mark as Paid)
                        const actionBtn = item.status === 'pending' 
                            ? `<button class="btn btn-sm btn-success" onclick="markAsPaid('${item.withdrawalId}')">Mark Paid</button>` 
                            : `<span class="text-success"><i class="bi bi-check-circle"></i></span>`;

                        tbody.innerHTML += `
                            <tr>
                                <td>
                                    <strong>${item.username || 'Unknown'}</strong><br>
                                    <small class="text-muted">${item.userId}</small>
                                </td>
                                <td><strong class="text-warning">$${(item.amount || 0).toFixed(2)} USDT</strong></td>
                                <td>${date}</td>
                                <td>
                                    <span class="wallet-address">${item.walletAddress}</span>
                                    <button class="btn-copy ms-2" onclick="copyAddress('${item.walletAddress}')">
                                        <i class="bi bi-clipboard"></i> Copy
                                    </button>
                                </td>
                                <td>${statusBadge}</td>
                                <td>${actionBtn}</td>
                            </tr>
                        `;
                    });
                    document.getElementById('pendingWithdrawals').innerText = pendingCount;
                    document.getElementById('totalWithdrawn').innerText = `$${paidTotal.toFixed(2)}`;
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No withdrawal requests found.</td></tr>';
                }
            });

            // 2. Listen to Rewards (For Stats)
            const rewardsRef = ref(db, `direct_diwali_offer/${CAMPAIGN_ID}/rewards`);
            onValue(rewardsRef, (snapshot) => {
                if (snapshot.exists()) {
                    const rewards = snapshot.val();
                    let totalUsers = Object.keys(rewards).length;
                    let totalRewards = 0;

                    // (Yahan hum simple calculation kar rahe hain, asli distribution user claims se hota hai)
                    for (let uid in rewards) {
                        totalRewards += (rewards[uid].requestedAmount || 0); // Just an estimate based on requests
                    }

                    document.getElementById('totalUsers').innerText = totalUsers;
                    document.getElementById('totalRewardsDist').innerText = `$${totalRewards.toFixed(2)}`;
                }
            });
        }

        // Mark Withdrawal as Paid
        window.markAsPaid = async function(withdrawalId) {
            if(!confirm("Are you sure you have sent the USDT to this wallet address?")) return;
            
            try {
                // Update admin node status
                await update(ref(db, `direct_diwali_offer/${CAMPAIGN_ID}/withdrawals/${withdrawalId}`), {
                    status: 'paid',
                    paidAt: Date.now()
                });
                alert('✅ Marked as Paid successfully!');
            } catch(e) {
                alert('Error: ' + e.message);
            }
        };

        // Initialize
        loadDiwaliData();
    </script>
</body>
</html>
