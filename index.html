<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RND Staking — Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--bg:#080e1a;--panel:#101d30;--line:#20334d;--muted:#91a4c2;--green:#2ecc71;--gold:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font-family:Inter,system-ui,Arial,sans-serif}
.navbar{background:#090f1c;border-bottom:1px solid var(--line);padding:14px 20px}.brand{font-weight:800;font-size:21px}.brand i{color:var(--green)}
.wrap{max-width:1500px;margin:auto;padding:24px 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px}
.stat{background:#101d30;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;height:100%}.stat .num{font-size:30px;font-weight:800}.stat .lbl{color:var(--muted);font-size:13px}
.stat i{font-size:22px;color:var(--green)}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin:24px 0}
.tab{border:1px solid var(--line);background:#101d30;color:#a8bad5;border-radius:10px;padding:9px 14px}.tab.active{background:#103329;color:#38e58a;border-color:#1c694a}
.table{color:#e8efff!important;white-space:nowrap}.table th{color:#9eb1ce!important;border-color:var(--line)!important}.table td{border-color:var(--line)!important;vertical-align:middle}.table-responsive{border-radius:12px}
.form-control,.form-select{background:#091321!important;color:#edf3ff!important;border-color:#2a3d59!important}.form-control::placeholder{color:#7184a3}
.muted{color:var(--muted)}.pill{border-radius:99px;padding:4px 9px;font-size:12px;background:#24334a}.ok{color:#4ade80}.bad{color:#fb7185}.warn{color:#fbbf24}
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px}
.btn-green{background:var(--green);color:#07130c;font-weight:700;border:0}.btn-green:hover{background:#26b863;color:#07130c}
.error{color:#fda4af;white-space:pre-wrap;font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){.wrap{padding:14px 10px}.panel{padding:14px}.stat .num{font-size:23px}}
</style>
</head>
<body>
<div id="loginScreen">
 <div class="loginbox">
  <div class="brand mb-2"><i class="bi bi-currency-bitcoin"></i> RND Staking</div>
  <div class="muted mb-4">Administrator sign in</div>
  <form id="loginForm">
   <label class="form-label">Admin email</label>
   <input id="email" class="form-control mb-3" type="email" value="admin@rndstaking.com" autocomplete="username" required>
   <label class="form-label">Password</label>
   <input id="password" class="form-control mb-3" type="password" autocomplete="current-password" required>
   <button id="loginBtn" class="btn btn-green w-100" type="submit">Login</button>
   <div id="loginError" class="error mt-3"></div>
  </form>
  <div class="muted small mt-3">Only the configured Firebase admin account is allowed.</div>
 </div>
</div>
<div id="appScreen" hidden>
 <nav class="navbar">
  <div class="container-fluid">
   <span class="brand"><i class="bi bi-currency-bitcoin"></i> RND Staking <span class="pill ms-2">Admin Panel</span></span>
   <div class="d-flex align-items-center gap-3">
    <span id="dbStatus" class="muted small">Connecting…</span><span id="who" class="muted small"></span>
    <button id="logout" class="btn btn-sm btn-danger"><i class="bi bi-box-arrow-right"></i> Logout</button>
   </div>
  </div>
 </nav>
 <main class="wrap">
  <div id="fatalError" class="error mb-3"></div>
  <div class="row g-3" id="stats"></div>
  <div class="tabs" id="tabs">
   <button class="tab active" data-tab="dashboard">Dashboard</button>
   <button class="tab" data-tab="users">Users</button>
   <button class="tab" data-tab="deposits">Deposits</button>
   <button class="tab" data-tab="withdrawals">Withdrawals</button>
   <button class="tab" data-tab="packages">Packages</button>
   <button class="tab" data-tab="diwali">Diwali Purchases</button>
   <button class="tab" data-tab="diwaliWithdrawals">Diwali Withdrawals</button>
   <button class="tab" data-tab="transfers">Transfers</button>
   <button class="tab" data-tab="settings">Settings</button>
  </div>
  <section id="content" class="panel"><div class="empty">Loading database records…</div></section>
 </main>
</div>
<script type="importmap">
{"imports":{
 "firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
 "firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
 "firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
}}
</script>
<script type="module">
import {initializeApp} from "firebase/app";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "firebase/auth";
import {getDatabase,ref,onValue} from "firebase/database";

const firebaseConfig={
 apiKey:"AIzaSyDsuqsmiwIG3Ey57MR19tr_8wJQRQ3_W64",
 authDomain:"rwebsite-e031b.firebaseapp.com",
 databaseURL:"https://rwebsite-e031b-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"rwebsite-e031b",
 storageBucket:"rwebsite-e031b.firebasestorage.app",
 messagingSenderId:"376966041558",
 appId:"1:376966041558:web:02bc9062ec182590275e77"
};
const ADMIN_EMAIL="admin@rndstaking.com";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const data={users:{},depositHistory:{},withdrawals:{},transferRequests:{},usedTransactions:{},purchases:{},diwaliTransactions:{},diwaliWithdrawals:{},rewards:{},claims:{},rankRewards:{},settings:{},usernames:{}};
const errors={};const unsub=[];let activeTab="dashboard";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const obj=v=>v&&typeof v==="object"?v:{};
const entries=v=>Object.entries(obj(v));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>"$"+num(v).toFixed(2);
const date=v=>{if(!v)return "—";const n=Number(v);const d=new Date(n<1e12?n*1000:n);return Number.isNaN(d.getTime())?"—":d.toLocaleString();};
const userName=(uid)=>{const u=data.users[uid]||{};return u.name||u.username||u.email||uid||"Unknown";};
function toastError(msg){$("fatalError").textContent=msg;}
function stopListeners(){while(unsub.length){try{unsub.pop()();}catch{}}}
function listen(key,path){
 const off=onValue(ref(db,path),snap=>{
  data[key]=snap.exists()?snap.val():{};
  delete errors[key];$("dbStatus").textContent="Live data connected";
  render();
 },err=>{
  errors[key]=err?.message||"Permission denied";
  $("dbStatus").textContent="Some data could not load";
  render();
 });
 unsub.push(off);
}
function startListeners(){
 stopListeners();Object.keys(data).forEach(k=>data[k]={});Object.keys(errors).forEach(k=>delete errors[k]);
 const paths={
  users:"users",depositHistory:"depositHistory",withdrawals:"withdrawals",
  transferRequests:"transferRequests",usedTransactions:"usedTransactions",
  purchases:"direct_diwali_offer_2026/purchases",
  diwaliTransactions:"direct_diwali_offer_2026/transactions",
  diwaliWithdrawals:"direct_diwali_offer_2026/withdrawals",
  rewards:"direct_diwali_offer_2026/rewards",
  claims:"direct_diwali_offer_2026/user_claims",
  rankRewards:"rankRewards",settings:"settings",usernames:"usernames"
 };
 Object.entries(paths).forEach(([k,p])=>listen(k,p));
}
function allUserTx(){
 const out=[];
 for(const [uid,u] of entries(data.users))for(const [id,t] of entries(u.transactions))out.push({id,uid,user:u,...t});
 return out.sort((a,b)=>num(b.timestamp)-num(a.timestamp));
}
function allPackages(){
 const out=[];
 for(const [uid,u] of entries(data.users))for(const [id,p] of entries(u.packages))out.push({id,uid,user:u,...p});
 return out.sort((a,b)=>num(b.timestamp)-num(a.timestamp));
}
function stat(label,value,icon){return `<div class="col-6 col-lg-3"><div class="stat"><i class="bi ${icon}"></i><div class="num">${value}</div><div class="lbl">${label}</div></div></div>`;}
function renderStats(){
 const us=entries(data.users).filter(([,u])=>u.role!=="admin");
 const deposits=us.reduce((s,[,u])=>s+num(u.depositWallet),0);
 const totalPackages=allPackages().length;
 const rate=data.settings.rate??"—";
 $("stats").innerHTML=[
  stat("Total Users",us.length,"bi-people"),
  stat("Diwali Packages",entries(data.purchases).length,"bi-gift"),
  stat("Deposit Wallet Total",money(deposits),"bi-wallet2"),
  stat("RND Rate",typeof rate==="number"||!Number.isNaN(Number(rate))?money(rate):esc(rate),"bi-currency-dollar")
 ].join("");
}
function errNotice(keys){
 const list=keys.filter(k=>errors[k]);
 return list.length?`<div class="alert alert-warning">Some sections are blocked by Firebase Rules: ${list.map(k=>esc(k)+": "+esc(errors[k])).join(" | ")}. Check the admin read rules for these exact paths.</div>`:"";
}
function table(headers,rows){
 if(!rows.length)return `<div class="empty">No records found.</div>`;
 return `<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function row(cells){return `<tr>${cells.map(c=>`<td>${c??"—"}</td>`).join("")}</tr>`;}
function sectionTitle(t,sub=""){return `<div class="d-flex justify-content-between flex-wrap gap-2 mb-3"><div><h5 class="mb-1">${t}</h5><div class="muted small">${sub}</div></div><input id="filter" class="form-control" style="max-width:280px" placeholder="Search visible records…"></div>`;}
function attachFilter(){const f=$("filter");if(!f)return;f.addEventListener("input",()=>{const q=f.value.toLowerCase();document.querySelectorAll("#content tbody tr").forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q));});}
function render(){
 renderStats();
 const tx=allUserTx(),pk=allPackages();
 let html="";
 if(activeTab==="dashboard"){
  const latest=[...tx.slice(0,15).map(t=>({type:t.type||"transaction",name:userName(t.uid),amount:t.amount,status:t.status,time:t.timestamp})),
   ...entries(data.purchases).map(([id,p])=>({type:"Diwali package",name:userName(p.buyerUid),amount:p.packageAmount,status:p.status,time:p.timestamp,id}))].sort((a,b)=>num(b.time)-num(a.time)).slice(0,25);
  html=errNotice(["users","purchases","settings"])+`<h5 class="mb-3">Recent Activity</h5>`+table(["Type","User","Amount","Status","Date"],latest.map(x=>row([esc(x.type),esc(x.name),money(x.amount),esc(x.status),date(x.time)])));
 }else if(activeTab==="users"){
  const rows=entries(data.users).filter(([,u])=>u.role!=="admin").map(([uid,u])=>row([esc(u.name||"—"),esc(u.username||"—"),esc(u.email||"—"),money(u.depositWallet),money(u.referralWallet),num(u.rndWallet).toFixed(4),esc(u.rank||"—"),esc(uid)]));
  html=errNotice(["users"])+sectionTitle("Registered Users",`${rows.length} user records`)+table(["Name","Username","Email","Deposit Wallet","Referral Wallet","RND Wallet","Rank","UID"],rows); 
 }else if(activeTab==="deposits"){
  const rows=entries(data.depositHistory).map(([id,x])=>row([esc(x.uid||"—"),esc(userName(x.uid)),money(x.amount),esc(x.currency||"USDT"),esc(x.status||"—"),esc(x.txHash||"—"),date(x.timestamp)]));
  html=errNotice(["depositHistory"])+sectionTitle("Deposit History",`${rows.length} records`)+table(["UID","User","Amount","Currency","Status","Tx Hash","Date"],rows);
 }else if(activeTab==="withdrawals"){
  const root=entries(data.withdrawals).map(([id,w])=>({id,...w,source:"withdrawals"}));
  const fromUsers=tx.filter(t=>t.type==="withdrawal").map(t=>({...t,source:"users"}));
  const merged=[...root,...fromUsers].sort((a,b)=>num(b.timestamp)-num(a.timestamp));
  html=errNotice(["withdrawals","users"])+sectionTitle("Withdrawals",`${merged.length} records · includes root withdrawals and user transaction history`)+table(["User","Amount","Wallet Type","Wallet Address","Status","Date"],merged.map(w=>row([esc(userName(w.uid||w.userId)),money(w.amount),esc(w.walletType||"—"),esc(w.wallet||w.walletAddress||"—"),esc(w.status||"—"),date(w.timestamp)])));
 }else if(activeTab==="packages"){
  html=errNotice(["users"])+sectionTitle("Staking Packages",`${pk.length} records`)+table(["User","Plan","USDT","Total RND","Released RND","Remaining RND","Status","Date"],pk.map(p=>row([esc(userName(p.uid)),esc(p.planName||p.planId||"Package"),money(p.usdtAmount),num(p.totalRND).toFixed(6),num(p.releasedRND).toFixed(6),num(p.remainingRND).toFixed(6),esc(p.status||"—"),date(p.timestamp||p.purchaseDate)])));
 }else if(activeTab==="diwali"){
  const rows=entries(data.purchases).map(([id,p])=>row([esc(p.purchaseId||id),esc(userName(p.buyerUid)),esc(p.directReferrerUid?userName(p.directReferrerUid):"—"),money(p.packageAmount),money(p.rewardAmount),esc(p.status||"—"),date(p.timestamp)]));
  html=errNotice(["purchases","users"])+sectionTitle("Direct Offer / Diwali Purchases",`${rows.length} purchases`)+table(["Purchase ID","Buyer","Direct Referrer","Package","Reward","Status","Date"],rows);
 }else if(activeTab==="diwaliWithdrawals"){
  const rows=entries(data.diwaliWithdrawals).map(([id,w])=>row([esc(w.withdrawalId||id),esc(userName(w.userId)),money(w.amount),esc(w.asset||w.currency||"USDT"),esc(w.walletAddress||"—"),esc(w.status||"—"),date(w.requestedAt||w.timestamp)]));
  html=errNotice(["diwaliWithdrawals","users"])+sectionTitle("Diwali Offer Withdrawals",`${rows.length} records`)+table(["Withdrawal ID","User","Amount","Asset","Wallet","Status","Requested"],rows);
 }else if(activeTab==="transfers"){
  const rows=entries(data.transferRequests).map(([id,t])=>row([esc(id),esc(t.uid||t.senderUid||"—"),esc(t.toUid||t.recipientUid||"—"),money(t.amount),esc(t.status||"—"),date(t.timestamp)]));
  html=errNotice(["transferRequests"])+sectionTitle("Transfer Requests",`${rows.length} records`)+table(["Request ID","From UID","To UID","Amount","Status","Date"],rows);
 }else if(activeTab==="settings"){
  const rows=entries(data.settings).map(([k,v])=>row([esc(k),esc(typeof v==="object"?JSON.stringify(v):v)]));
  html=errNotice(["settings"])+`<h5 class="mb-3">Settings (read only)</h5>`+table(["Setting","Value"],rows)+`<div class="muted small mt-3">This panel does not change financial settings or balances.</div>`;
 }
 $("content").innerHTML=html;
 attachFilter();
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render();}));
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();$("loginError").textContent="";$("loginBtn").disabled=true;$("loginBtn").textContent="Signing in…";
 try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);}
 catch(err){$("loginError").textContent=err.code?`${err.code}: ${err.message}`:err.message;}
 finally{$("loginBtn").disabled=false;$("loginBtn").textContent="Login";}
});
$("logout").addEventListener("click",()=>signOut(auth));
onAuthStateChanged(auth,async user=>{
 if(!user){stopListeners();$("appScreen").hidden=true;$("loginScreen").hidden=false;return;}
 if((user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
  await signOut(auth);$("loginError").textContent=`Access denied. Sign in with ${ADMIN_EMAIL}`;return;
 }
 $("loginScreen").hidden=true;$("appScreen").hidden=false;$("who").textContent=user.email;
 $("dbStatus").textContent="Checking database permissions…";startListeners();
});
</script>
</body>
</html>
